syntax = "proto3";

package student;

service StudentService {
  rpc GetAllStudents (Empty) returns (StudentList);
  rpc GetStudentById (StudentRequest) returns (Student);
}

message StudentRequest {
  string id = 1;
}

message StudentList {
  repeated Student students = 1;
}

message Student {
  string id = 1;
  string firstName = 2;
  string lastName = 3;
  int32 age = 4;
  string specialty = 5;
}

message Empty {}
